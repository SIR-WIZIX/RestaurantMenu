name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.0

      - name: Publish
        run: |
          dotnet publish RestaurantMenu/RestaurantMenu.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/RestaurantMenu.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
